[project]
name = "invoiceiq"
version = "0.1.0"
description = "InvoiceIQ — AI Finance Operations Copilot (portfolio project, fictional data only)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "openai>=1.50",
    "azure-identity>=1.17",
    "httpx>=0.27",
    "streamlit>=1.40",
    "azure-data-tables>=12.5",
    "azure-storage-blob>=12.20",
    "azure-servicebus>=7.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoiceiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/browser"]  # manual browser checks (see tests/browser/)
addopts = "-ra --strict-markers"
filterwarnings = [
    # Frontend tests route the real ApiClient through Starlette's TestClient, which warns about
    # per-request timeouts. Production uses httpx.Client, where timeouts are honoured.
    "ignore:You should not use the 'timeout' argument with the TestClient",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow typographic characters (—, ×) in text

[tool.ruff.lint.per-file-ignores]
# Manual browser test script: long assertion messages and terse loop variables are fine.
"tests/browser/*" = ["E501", "E741"]
