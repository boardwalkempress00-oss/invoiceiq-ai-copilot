# Publish the container image to GHCR. Manual only; never deploys anything.
#
# Gate: the image is published only for a commit on main whose CI run (push event) succeeded.
# Tags: the full commit SHA only — never `latest`. Consumers should pin the digest from the summary.

name: Publish image

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-image-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/boardwalkempress00-oss/invoiceiq-ai-copilot

jobs:
  verify-ci:
    name: Verify CI passed for this commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a successful CI run on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&branch=main" \
            --jq '[.workflow_runs[] | select(.status == "completed")] | sort_by(.run_number) | last | .conclusion // "none"')"
          echo "CI conclusion for ${GITHUB_SHA}: ${conclusion}"
          test "${conclusion}" = "success"

  publish:
    name: Build and push (amd64 + arm64)
    needs: verify-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=invoiceiq-ai-copilot
            org.opencontainers.image.description=InvoiceIQ AI finance-operations copilot (fictional demo data)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record digest
        run: |
          echo "${IMAGE}@${DIGEST}" > image-ref.txt
          {
            echo "### Published image"
            echo ""
            echo "- Tag: \`${IMAGE}:${GITHUB_SHA}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Pin with: \`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: image-ref
          path: image-ref.txt
          retention-days: 90

  smoke-test:
    name: Smoke test published image (by digest)
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run and check the container
        env:
          REF: ${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}
        run: |
          docker run -d --name invoiceiq -p 127.0.0.1:8501:8501 "$REF"
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' invoiceiq)
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          echo "health: $status"; [ "$status" = "healthy" ]
          curl -fsS http://127.0.0.1:8501/_stcore/health
          test "$(docker exec invoiceiq id -u)" = "10001"
          if curl -fsS -m 3 http://127.0.0.1:8000/health; then echo "API exposed" >&2; exit 1; fi
          test "$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' invoiceiq)" = "$GITHUB_SHA"
          docker stop --time 30 invoiceiq
          test "$(docker inspect -f '{{.State.ExitCode}}' invoiceiq)" = "0"
