[theme]
base = "light"
primaryColor = "#1f5f99"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f7fa"
textColor = "#1b2430"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[server]
headless = true
# Serves frontend/static/ at /app/static/ (only the "Session paused" page lives there).
enableStaticServing = true
maxUploadSize = 1

[browser]
gatherUsageStats = false
